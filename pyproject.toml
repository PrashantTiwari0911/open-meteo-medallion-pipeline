[project]
name = "open-meteo-medallion"
version = "0.1.0"
description = "Open-Meteo weather pipeline using a bronze/silver/gold Medallion architecture on DuckDB"
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "duckdb>=1.1", "pyyaml>=6"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
